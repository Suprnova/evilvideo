name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 ninja-build nasm pkg-config meson wine wine64 xvfb

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ hashFiles('ffmpeg/build.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ffmpeg/build.sh

      - name: Configure
        run: cmake --preset mingw

      - name: Build
        run: cmake --build --preset mingw

      # The RAD watcher tests create windows, which Wine can only do with a display.
      - name: Test
        run: xvfb-run -a ctest --preset mingw
        env:
          WINEDEBUG: -all

      - uses: actions/upload-artifact@v7
        with:
          name: evilvideo
          path: |
            build/mingw/evilvideo.exe
            build/mingw/evilvideo-cli.exe
            build/ffmpeg/
          if-no-files-found: error

      # A v<version> tag makes a draft release, which a maintainer reviews and publishes.
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! grep -q "project(evilvideo VERSION $version " CMakeLists.txt; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version in CMakeLists.txt"
            exit 1
          fi
          mkdir build/release
          cp build/mingw/evilvideo.exe build/mingw/evilvideo-cli.exe build/ffmpeg/ffmpeg.exe LICENSE build/release/
          cp -r build/ffmpeg/licenses build/release/
          cp README.md build/release/README.txt
          (cd build/release && zip -q -r -9 "../evilvideo-$version-windows-x64.zip" .)

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          source=$(grep -o 'https://github.com/FFmpeg/FFmpeg/tree/[^ ]*' build/ffmpeg/licenses/ffmpeg-build.txt)
          cat > build/notes.md <<EOF
          This software uses code of [FFmpeg](https://ffmpeg.org) licensed under the [LGPLv3](https://www.gnu.org/licenses/lgpl-3.0.html) and its source can be downloaded [here]($source). \`licenses/ffmpeg-build.txt\` in the zip says how it was built.
          EOF
          gh release create "$GITHUB_REF_NAME" "build/evilvideo-$version-windows-x64.zip" --draft --title "evilvideo $version" --notes-file build/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
